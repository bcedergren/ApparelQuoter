<!DOCTYPE html>
<html>
	<head>
		<style type="text/css">
			body {
				font-family: Arial, sans-serif;
				background-color: #f7f7f7;
				margin: 0;
				padding: 0;
			}
			.container {
				width: 100%;
				max-width: 600px;
				margin: 0 auto;
				background-color: #ffffff;
				padding: 20px;
				border: 1px solid #dddddd;
				box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
				border-radius: 8px;
			}
			.header {
				text-align: center;
			}
			.header img {
				width: 250px;
			}
			.content {
				padding: 20px 0;
			}
			.content h1 {
				font-size: 24px;
				color: #333333;
			}
			.content p {
				font-size: 16px;
				color: #555555;
			}
			.button-container {
				text-align: center;
				margin: 20px 0;
			}
			.button {
				background-color: #007bff;
				color: #ffffff;
				padding: 10px 20px;
				text-decoration: none;
				border-radius: 5px;
				font-size: 16px;
			}
			.ii a[href] {
				color: #ffffff;
			}
			.footer {
				text-align: center;
				font-size: 14px;
				color: #999999;
				padding: 20px 0;
				border-top: 1px solid #dddddd;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<img
					src="https://www.apparelquoter.com/_next/image?url=%2Flogo.png&w=256&q=75"
					alt="Logo"
				/>
			</div>
			<div class="content">
				<h1>Password Reset Request</h1>
				<p>Hi there,</p>
				<p>
					You requested a password reset for your account. Click the button
					below to reset your password.
				</p>
				<div class="button-container">
					<a
						href="{{resetUrl}}"
						class="button"
						>Reset Password</a
					>
				</div>
				<p>
					If you did not request a password reset, please ignore this email.
				</p>
			</div>
			<div class="footer">
				<p>&copy; 2024 ApparelQuoter. All rights reserved.</p>
			</div>
		</div>
	</body>
</html>
