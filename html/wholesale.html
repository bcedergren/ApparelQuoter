<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Wholesale Markup Table</title>
		<style>
			.wholesale-table {
				width: 100%;
				border-collapse: collapse;
			}

			.wholesale-table th,
			.wholesale-table td {
				border: 1px solid black;
				padding: 8px;
				text-align: left;
			}

			.wholesale-table th {
				background-color: #333;
				color: white;
			}

			.wholesale-table .row-header {
				background-color: #ddd;
			}

			.wholesale-table .row-header th {
				text-align: center;
				color: black;
			}

			.wholesale-table .highlight {
				color: red;
			}

			.wholesale-table .and-or {
				text-align: center;
			}
		</style>
	</head>
	<body>
		<table class="wholesale-table">
			<tr class="row-header">
				<th colspan="2">T-SHIRT WHOLESALE MARKUP %</th>
			</tr>
			<tr>
				<td>Less than</td>
				<td><span class="highlight">$2.50</span></td>
				<td>Markup is</td>
				<td>175%</td>
				<td class="and-or">AND/OR</td>
				<td><span class="highlight">$0.25</span></td>
			</tr>
			<tr>
				<td>Between</td>
				<td>
					<span class="highlight">$2.51</span> &
					<span class="highlight">$7.99</span>
				</td>
				<td>Markup is</td>
				<td>150%</td>
				<td class="and-or">AND/OR</td>
				<td><span class="highlight">$0.50</span></td>
			</tr>
			<tr>
				<td>Over</td>
				<td><span class="highlight">$8.00</span></td>
				<td>Markup is</td>
				<td>125%</td>
				<td class="and-or">AND/OR</td>
				<td><span class="highlight">$0.75</span></td>
			</tr>
		</table>
	</body>
</html>
